<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Eclipsi AR 2026 · 12 d'agost</title>
<meta name="description" content="Compte enrere, circumstàncies locals i realitat augmentada per a l'eclipsi solar total del 12 d'agost de 2026. Calculat en viu des dels elements besselians de la NASA.">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eclipse AR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=31">
</head>
<body>

<div id="starfield"></div>
<canvas id="stars"></canvas>

<div class="wrap">

  <!-- ══════════════ SELECTOR D'IDIOMA ══════════════ -->
  <div class="langbar" role="group" aria-label="Idioma">
    <button class="lang-btn" data-lang="ca" title="Català" aria-label="Català">
      <svg viewBox="0 0 27 18" aria-hidden="true">
        <rect width="27" height="18" fill="#FCDD09"/>
        <g fill="#DA121A">
          <rect y="2" width="27" height="2"/><rect y="6" width="27" height="2"/>
          <rect y="10" width="27" height="2"/><rect y="14" width="27" height="2"/>
        </g>
      </svg>
    </button>
    <button class="lang-btn" data-lang="es" title="Castellano" aria-label="Castellano">
      <svg viewBox="0 0 30 20" aria-hidden="true">
        <rect width="30" height="20" fill="#AA151B"/>
        <rect y="5" width="30" height="10" fill="#F1BF00"/>
      </svg>
    </button>
    <button class="lang-btn" data-lang="en" title="English" aria-label="English">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <clipPath id="ukclip"><rect width="60" height="30"/></clipPath>
        <g clip-path="url(#ukclip)">
          <rect width="60" height="30" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3.5"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
        </g>
      </svg>
    </button>
    <button class="lang-btn" data-lang="fr" title="Français" aria-label="Français">
      <svg viewBox="0 0 30 20" aria-hidden="true">
        <rect width="10" height="20" fill="#002395"/>
        <rect x="10" width="10" height="20" fill="#fff"/>
        <rect x="20" width="10" height="20" fill="#ED2939"/>
      </svg>
    </button>
    <button class="lang-btn" data-lang="de" title="Deutsch" aria-label="Deutsch">
      <svg viewBox="0 0 30 18" aria-hidden="true">
        <rect width="30" height="6" fill="#000"/>
        <rect y="6" width="30" height="6" fill="#DD0000"/>
        <rect y="12" width="30" height="6" fill="#FFCE00"/>
      </svg>
    </button>

  </div>

  <!-- ══════════════ CAPÇALERA ══════════════ -->
  <header class="hero">
    <div class="kicker" data-i18n="app.kicker"></div>
    <h1 data-i18n="app.title"></h1>
  </header>

  <!-- ── Compte enrere ── -->
  <section class="card">
    <div class="cd-head">
      <div class="countdown-label" id="cdLabel"></div>
      <button class="info-btn" data-info="cdHint" aria-label="?">i</button>
    </div>
    <div class="countdown tappable" id="countdown" role="button" tabindex="0">
      <div class="cd-unit"><div class="cd-num" id="cdD">—</div><div class="cd-lab" data-i18n="cd.days"></div></div>
      <div class="cd-unit"><div class="cd-num" id="cdH">—</div><div class="cd-lab" data-i18n="cd.hours"></div></div>
      <div class="cd-unit"><div class="cd-num" id="cdM">—</div><div class="cd-lab" data-i18n="cd.min"></div></div>
      <div class="cd-unit"><div class="cd-num" id="cdS">—</div><div class="cd-lab" data-i18n="cd.sec"></div></div>
    </div>
    <div class="cd-hint info-box hidden" id="cdHint" data-i18n="cd.tap"></div>

    <div class="progress-shell">
      <div class="progress-track">
        <div class="progress-fill" id="progFill"></div>
        <div class="progress-totality hidden" id="progTot"></div>
      </div>
      <div class="progress-marks" id="progMarks"></div>
    </div>
  </section>

  <!-- ══════════════ UBICACIÓ (sempre visible) ══════════════ -->
  <div class="locbar">
    <!-- Estat del GPS: un punt que canvia de color i parpelleja -->
    <button class="geo-dot" id="btnGeo" data-geo="idle" data-i18n-title="app.geo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span class="sr-only" id="geoLabel" data-i18n="app.geo"></span>
    </button>
    <span class="chip" id="locChip"></span>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════
       PESTANYA · ARA
       ═════════════════════════════════════════════════════════════════ -->
  <div class="pane on" id="pane-now" role="tabpanel">

    <!-- ── Detall del punt (a l'estil del visualitzador de l'IGN) ── -->
    <section class="card" id="detailCard">
      <h2><span class="dot"></span><span data-i18n="dt.title"></span>
        <button class="info-btn" data-info="dtIntro" aria-label="?">i</button></h2>
      <div class="muted info-box hidden" id="dtIntro" data-i18n="dt.intro"></div>
      <div class="dt-maprow">
        <div id="dtMap"></div>
        <span class="dt-azbadge" id="dtAz"></span>
      </div>
      <div class="dt-panel" id="dtPanel"></div>
      <div class="dt-vis">
        <div class="dt-h" data-i18n="dt.visProfile"></div>
        <div class="dt-verdict" id="dtVerdict"></div>
        <div class="dt-hides" id="dtHides"></div>
        <canvas id="dtChart"></canvas>
        <div class="dt-scrub">
          <div class="dt-scrub-row">
            <b id="dtTime">—</b>
            <span id="dtSunAt"></span>
            <button class="city-btn" id="dtToMax" data-i18n="dt.toMax"></button>
          </div>
          <input type="range" id="dtSlider" min="0" max="1000" value="500" step="1">
        </div>
        <div class="hz-legend">
          <span><i class="sw-ter"></i><span data-i18n="dt.legTerrain"></span></span>
          <span><i class="sw-obs"></i><span data-i18n="dt.legObs"></span></span>
          <span><i class="sw-los"></i><span data-i18n="dt.legLos"></span></span>
        </div>
        <div class="muted" data-i18n="dt.visNote"></div>
      </div>
    </section>

    <!-- ── Horitzó ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.horizon"></span></h2>
      <div class="muted" data-i18n="hz.intro"></div>
      <div class="hz-wrap hidden" id="hzWrap">
        <canvas id="hzCanvas" width="760" height="380"></canvas>
        <div class="hz-legend">
          <span><i class="sw-terrain"></i><span data-i18n="hz.terrain"></span></span>
          <span><i class="sw-sun"></i><span data-i18n="hz.sunpath"></span></span>
        </div>
      </div>
      <div id="hzBody"></div>
      <div class="muted hz-note" data-i18n="hz.note"></div>
    </section>

    

    

    <!-- ── Avisos ── -->
    <div id="alerts"></div>

    <!-- ── Núvols ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.weather"></span></h2>
      <div id="wxBody" class="wx-body"></div>
      <div class="muted wx-warn" data-i18n="wx.lowWarn"></div>
      <div class="wx-clima"><div id="climaBody"></div></div>
    </section>

    

    <!-- ── Eines ── -->
    <section class="toolbar">
      <button class="tool tool-hero" id="btnVoice">
        <span class="tool-ico">🔊</span>
        <span class="tool-txt">
          <b id="voiceTitle"></b>
          <small data-i18n="tl.voiceDesc"></small>
        </span>
        <span class="tool-sw" aria-hidden="true"></span>
      </button>
      <div class="tool-grid">
        <button class="tool" id="btnBrief">
          <span class="tool-ico">🗣️</span><b data-i18n="tl.brief"></b><small data-i18n="tl.briefDesc"></small>
        </button>
        <button class="tool" id="btnICS">
          <span class="tool-ico">📅</span><b data-i18n="tl.ics"></b><small data-i18n="tl.icsDesc"></small>
        </button>
        <button class="tool" id="btnNotify">
          <span class="tool-ico">🔔</span><b data-i18n="tl.notify"></b><small data-i18n="tl.notifyDesc"></small>
        </button>
        <button class="tool" id="btnShare">
          <span class="tool-ico">🔗</span><b data-i18n="tl.share"></b><small data-i18n="tl.shareDesc"></small>
        </button>
        <button class="tool" id="btnInstall">
          <span class="tool-ico">⬇️</span><b data-i18n="tl.install"></b><small data-i18n="tl.installDesc"></small>
        </button>
      </div>
      <div class="muted" id="voiceNote"></div>
    </section>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════
       PESTANYA · PLANIFICAR
       ═════════════════════════════════════════════════════════════════ -->
  <div class="pane" id="pane-plan" role="tabpanel">

    <!-- ══════════════ CERCADOR DE LLOCS ══════════════ -->
    <div class="findbar">
      <input type="search" id="findInput" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="find.ph">
      <div class="find-list" id="findList"></div>
    </div>

    <!-- ── On em poso ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.planner"></span></h2>
      <div class="muted" data-i18n="pl.intro"></div>
      <div class="muted" id="plStatus"></div>
      <div class="pl-list" id="plResults"></div>
      <div class="muted pl-note" data-i18n="pl.officialNote"></div>
      <div class="muted" data-i18n="pl.note"></div>
    </section>

    <!-- ── Mapa ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.band"></span></h2>
      <div id="map"></div>
      <div class="map-legend">
        <span><i style="background:#ffab3d"></i><span data-i18n="legend.center"></span></span>
        <span><i style="background:rgba(255,171,61,.5)"></i><span data-i18n="legend.band"></span></span>
        <span><i style="background:#4fd6ff"></i><span data-i18n="legend.you"></span></span>
      </div>
      <div class="muted" id="mapNote"></div>
    </section>

    <!-- ── Ciutats ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.cities"></span></h2>
      <div class="cities" id="cities"></div>
      <div class="muted" data-i18n="cities.note"></div>
    </section>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════
       PESTANYA · CEL
       ═════════════════════════════════════════════════════════════════ -->
  <div class="pane" id="pane-sky" role="tabpanel">

    <!-- ── Simulació ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.sim"></span></h2>
      <div class="sim-wrap">
        <canvas id="simCanvas" width="640" height="640"></canvas>
        <div class="sim-readout">
          <div class="ro"><div class="ro-v" id="roMag">—</div><div class="ro-l" data-i18n="ro.mag"></div></div>
          <div class="ro"><div class="ro-v" id="roObs">—</div><div class="ro-l" data-i18n="ro.obs"></div></div>
          <div class="ro"><div class="ro-v" id="roPhase">—</div><div class="ro-l" data-i18n="ro.phase"></div></div>
        </div>
        <div class="scrub">
          <div class="scrub-row">
            <span data-i18n="scrub.explore"></span>
            <b id="scrubTime" data-i18n="scrub.live"></b>
          </div>
          <input type="range" id="scrub" min="-100" max="100" value="0" step="0.1">
          <div class="scrub-row" style="margin:6px 0 0">
            <span class="muted" data-i18n="scrub.drag"></span>
            <button class="city-btn" id="scrubReset" data-i18n="scrub.back"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Fases ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.phases"></span></h2>
      <div class="phases" id="phases"></div>
      <div class="muted" data-i18n="phases.note"></div>
    </section>

    <!-- ── Posició del Sol ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.sun"></span></h2>
      <div class="sunpos">
        <canvas id="compass" width="320" height="320"></canvas>
        <div class="sunpos-data">
          <div class="spd"><span class="spd-l" data-i18n="sun.az"></span><span class="spd-v" id="sunAz">—</span></div>
          <div class="spd"><span class="spd-l" data-i18n="sun.alt"></span><span class="spd-v" id="sunAlt">—</span></div>
          <div class="spd"><span class="spd-l" data-i18n="sun.dir"></span><span class="spd-v" id="sunDir">—</span></div>
          <div class="spd"><span class="spd-l" data-i18n="sun.set"></span><span class="spd-v" id="sunSet">—</span></div>
        </div>
      </div>
      <div class="muted" data-i18n="sun.note"></div>
    </section>

    <!-- ── Dades locals ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.local"></span></h2>
      <div class="grid2" id="stats"></div>
    </section>

    <!-- ── Seguretat ── -->
    <section class="card">
      <h2><span class="dot"></span><span data-i18n="card.safety"></span></h2>
      <div class="alert danger">
        <span class="alert-ico">⛔</span><div data-i18n="safety.1"></div>
      </div>
      <div class="alert ok">
        <span class="alert-ico">👁️</span><div data-i18n="safety.2"></div>
      </div>
      <div class="alert info">
        <span class="alert-ico">📷</span><div data-i18n="safety.3"></div>
      </div>
      <div class="alert warn">
        <span class="alert-ico">🏔️</span><div data-i18n="safety.4"></div>
      </div>
    </section>
  </div>

  <footer>
    <p class="muted" data-i18n="footer"></p>
  </footer>
</div>

<!-- ══════════════ BARRA DE PESTANYES ══════════════ -->
<nav class="tabbar" role="tablist">
  <button class="tabbtn on" data-pane="now" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
    </svg>
    <span data-i18n="tab.now"></span>
  </button>
  <button class="tabbtn" data-pane="plan" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
      <path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v12.5"/>
    </svg>
    <span data-i18n="tab.plan"></span>
  </button>
  <button class="tabbtn" data-pane="sky" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
    </svg>
    <span data-i18n="tab.sky"></span>
  </button>
  <button class="tabbtn tab-ar" id="btnAR">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 8V5a2 2 0 012-2h3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M21 16v3a2 2 0 01-2 2h-3"/>
      <circle cx="12" cy="12" r="3.2"/>
    </svg>
    <span data-i18n="dock.arShort"></span>
  </button>
</nav>

<!-- ══════════════ VISTA AR ══════════════ -->
<div id="arView">
  <video id="arVideo" playsinline muted autoplay></video>
  <canvas id="arCanvas"></canvas>
  <div class="ar-ui">
    <div class="ar-top">
      <div class="ar-pill" id="arInfo" data-i18n="ar.starting"></div>
      <button class="ar-close" id="arClose">✕</button>
    </div>
    <div class="ar-bottom">
      <div class="ar-hint" id="arHint" data-i18n="ar.hintDefault"></div>
      <div class="ar-controls">
        <button class="ar-btn on" id="arTrack" data-i18n="ar.track"></button>
        <button class="ar-btn on" id="arDisk" data-i18n="ar.disk"></button>
        <button class="ar-btn" id="arCal" data-i18n="ar.cal"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js?v=31"></script>
<script src="js/i18n2.js?v=31"></script>
<script src="js/netcache.js?v=31"></script>
<script src="js/places.js?v=31"></script>
<script src="js/official.js?v=31"></script>
<script src="js/geocode.js?v=31"></script>
<script src="js/detail.js?v=31"></script>
<script src="js/spots.js?v=31"></script>
<script src="js/voice.js?v=31"></script>
<script src="js/astro.js?v=31"></script>
<script src="js/eclipse.js?v=31"></script>
<script src="js/horizon.js?v=31"></script>
<script src="js/weather.js?v=31"></script>
<script src="js/planner.js?v=31"></script>
<script src="js/ar.js?v=31"></script>
<script src="js/app.js?v=31"></script>
<script src="js/panels.js?v=31"></script>
</body>
</html>
